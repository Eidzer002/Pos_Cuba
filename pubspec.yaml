name: pos_cuba
description: Sistema de Punto de Venta para Cuba - Flutter + PowerSync + Supabase

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.1

  # Offline-First Database
  powersync: ^1.17.0
  sqlite3_flutter_libs: ^0.5.21

  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts (para reportes)
  fl_chart: ^0.68.0

  # Share/Export
  share_plus: ^8.0.3
  csv: ^6.0.0

  # File Picker (importar CSV)
  file_picker: ^8.1.2

  # Barcode scanning
  mobile_scanner: ^5.1.1

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
