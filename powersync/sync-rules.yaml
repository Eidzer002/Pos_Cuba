config:
  edition: 3

streams:
  by_user:
    auto_subscribe: true
    queries:
      - SELECT * FROM businesses WHERE owner_id = auth.user_id()
      - SELECT * FROM categories WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM products WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM workers WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM cash_sessions WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM cash_movements WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM sales WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM sale_items WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
      - SELECT * FROM stock_movements WHERE business_id IN (SELECT id FROM businesses WHERE owner_id = auth.user_id())
